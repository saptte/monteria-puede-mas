# Virtual host para Montería Puede Más en Apache (EC2).
# DocumentRoot debe apuntar a la carpeta dist del build (su contenido, no la carpeta del código fuente).
#
# Ubuntu/Debian:
#   sudo a2enmod rewrite
#   sudo cp deploy/monteria-puede-mas.conf /etc/apache2/sites-available/monteria-puede-mas.conf
#   sudo a2ensite monteria-puede-mas
#   sudo systemctl reload apache2
#
# Amazon Linux:
#   sudo cp deploy/monteria-puede-mas.conf /etc/httpd/conf.d/monteria-puede-mas.conf
#   sudo systemctl reload httpd

<VirtualHost *:80>
    ServerName monteria-puede-mas
    DocumentRoot /var/www/monteria-puede-mas

    <Directory /var/www/monteria-puede-mas>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
</VirtualHost>
